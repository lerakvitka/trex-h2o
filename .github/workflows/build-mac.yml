name: Build macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload zips to (e.g. v1.0.0). Leave blank to just produce build artifacts."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run pack:mac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: release/*-darwin-*.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Uploading to release $TAG"
          gh release upload "$TAG" release/*-darwin-*.zip --clobber
